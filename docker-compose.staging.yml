name: grand-sampan-staging

services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://staging.grandsampanresort.com}
        # Internal rewrite target for /uploads → backend (never the public CF URL).
        - API_URL=http://grand-sampan-staging-backend:4000
      target: production
    container_name: grand-sampan-staging-frontend
    restart: unless-stopped
    environment:
      # Server-rendered pages call the backend over the internal Docker
      # network instead of hairpinning back out through the public domain.
      - API_URL=http://grand-sampan-staging-backend:4000
    networks:
      - staging-network
    ports:
      - "${FRONTEND_PORT:-3004}:3000"

  backend:
    build:
      context: ./backend
      target: production
    container_name: grand-sampan-staging-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Bootstraps the first admin account on startup; only created if this
      # email doesn't already exist, so it's safe to leave set permanently.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://staging.grandsampanresort.com}
      - SMTP_HOST=${SMTP_HOST:-smtppro.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-admin@grandsampanresort.com}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-Grand Sampan Resort <admin@grandsampanresort.com>}
      - MAIL_BCC=${MAIL_BCC:-}
    ports:
      - "${BACKEND_PORT:-4004}:4000"
    volumes:
      # Persist uploaded media across container rebuilds/redeploys.
      - staging_uploads_data:/app/uploads
    networks:
      - staging-network
    depends_on:
      primary-db:
        condition: service_healthy

  primary-db:
    image: postgres:17-alpine
    container_name: grand-sampan-staging-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-grand_sampan_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-grand_sampan_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - staging-network

networks:
  staging-network:
    name: grand-sampan-staging-network
    driver: bridge

volumes:
  staging_uploads_data:
    name: grand_sampan_staging_uploads_data
  staging_pgdata:
    name: grand_sampan_staging_pgdata
