services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=grand_sampan
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://app:app@db:5432/grand_sampan
      - JWT_SECRET=grand-sampan-sales-launch-secret
      # Dev-only bootstrap admin; the account is created once on first boot.
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
      - ADMIN_NAME=Dev Admin
      # Optional Zoho SMTP — leave SMTP_PASS empty to skip sending in local dev
      - PUBLIC_SITE_URL=http://localhost:3000
      - SMTP_HOST=${SMTP_HOST:-smtppro.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Grand Sampan Resort <admin@grandsampanresort.com>}
      - MAIL_BCC=${MAIL_BCC:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://backend:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
volumes:
  db_data:
