name: CI
on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: grand_sampan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d grand_sampan"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - name: Prisma migrate
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - name: Seed DB
        run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - run: npm run test
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: grand_sampan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d grand_sampan"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - name: Prisma migrate
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - name: Seed DB
        run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/grand_sampan
      - name: Run integration tests
        run: npm run test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gs-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t gs-frontend:ci ./frontend
  # ─── Deploy to Production ────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Update Code on Server
        uses: appleboy/ssh-action@b0a8f324e192469585a608d1f586061cf28a6571
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd  ${{ secrets.APP_PATH }}
            git fetch -p
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

      - name: Build and Deploy Containers
        uses: appleboy/ssh-action@b0a8f324e192469585a608d1f586061cf28a6571
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd  ${{ secrets.APP_PATH }}
            docker compose -f docker-compose.production.yml up -d --build
