services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        # Internal rewrite target for /uploads → backend (never the public CF URL).
        - API_URL=http://grand-sampan-backend:4000
      target: production
    container_name: grand-sampan-frontend
    restart: unless-stopped
    environment:
      # Server-rendered pages call the backend over the internal Docker
      # network instead of hairpinning back out through the public domain.
      - API_URL=http://grand-sampan-backend:4000
    networks:
      - app-network
    ports:
      - "3005:3000"

  backend:
    build:
      context: ./backend
      target: production
    container_name: grand-sampan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Bootstraps the first admin account on startup; only created if this
      # email doesn't already exist, so it's safe to leave set permanently.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://staging.grandsampanresort.com}
      - SMTP_HOST=${SMTP_HOST:-smtppro.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-admin@grandsampanresort.com}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-admin@grandsampanresort.com}
      - MAIL_BCC=${MAIL_BCC:-admin@grandsampanresort.com}
    ports:
      - "4005:4000"
    volumes:
      # Persist uploaded media across container rebuilds/redeploys.
      - uploads_data:/app/uploads
    networks:
      - app-network

  primary-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    networks:
      - app-network
  # db-explorer:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.com}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
  #   networks:
  #     - app-network
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   restart: unless-stopped
  #   ports:
  #     - "8088:80"
networks:
  app-network:
    external: false

volumes:
  grand_sampan_db_prod_data:
  uploads_data:
  pgdata:
    external: true
  pgadmin_data:
