services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      target: production
    container_name: grand-sampan-frontend
    restart: unless-stopped
    environment:
      # Server-rendered pages call the backend over the internal Docker
      # network instead of hairpinning back out through the public domain
      # and Traefik; the browser still uses NEXT_PUBLIC_API_URL.
      - API_URL=http://grand-sampan-backend:4000
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grand-sampan-frontend.rule=Host(`grand-sampan.gkibria121.com`)"
      - "traefik.http.routers.grand-sampan-frontend.entrypoints=web"
      - "traefik.http.services.grand-sampan-frontend.loadbalancer.server.port=3000"

  backend:
    build:
      context: ./backend
      target: production
    container_name: grand-sampan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Bootstraps the first admin account on startup; only created if this
      # email doesn't already exist, so it's safe to leave set permanently.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grand-sampan-backend.rule=Host(`grand-sampan.gkibria121.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.grand-sampan-backend.entrypoints=web"
      - "traefik.http.services.grand-sampan-backend.loadbalancer.server.port=4000"

networks:
  traefik-network:
    external: true

volumes:
  grand_sampan_db_prod_data:
