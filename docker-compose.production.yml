services:
  frontend:
    build:
      context: ./Unitech/Grand Sampan Resort/frontend
      target: production
    container_name: grand-sampan-frontend
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grand-sampan-frontend.rule=Host(`grand-sampan.gkibria121.com`)"
      - "traefik.http.routers.grand-sampan-frontend.entrypoints=web"
      - "traefik.http.services.grand-sampan-frontend.loadbalancer.server.port=3000"

  backend:
    build:
      context: ./Unitech/Grand Sampan Resort/backend
      target: production
    container_name: grand-sampan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grand-sampan-backend.rule=Host(`api.grand-sampan.gkibria121.com`)"
      - "traefik.http.routers.grand-sampan-backend.entrypoints=web"
      - "traefik.http.services.grand-sampan-backend.loadbalancer.server.port=4000"

networks:
  traefik-network:
    external: true

volumes:
  grand_sampan_db_prod_data:
