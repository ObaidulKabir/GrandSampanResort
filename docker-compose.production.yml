services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      target: production
    container_name: grand-sampan-frontend
    restart: unless-stopped
    environment:
      # Server-rendered pages call the backend over the internal Docker
      # network instead of hairpinning back out through the public domain
      # and Traefik; the browser still uses NEXT_PUBLIC_API_URL.
      - API_URL=http://grand-sampan-backend:4000
    networks:
      - app-network 
    ports:
      - "3005:3000"
  backend:
    build:
      context: ./backend
      target: production
    container_name: grand-sampan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Bootstraps the first admin account on startup; only created if this
      # email doesn't already exist, so it's safe to leave set permanently.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://www.grandsampanresort.com}
      - SMTP_HOST=${SMTP_HOST:-smtppro.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-admin@grandsampanresort.com}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-admin@grandsampanresort.com}
      - MAIL_BCC=${MAIL_BCC:-admin@grandsampanresort.com}
    ports:
      - "4005:4000"
    volumes:
      # Persist uploaded media across container rebuilds/redeploys.
      - uploads_data:/app/uploads
    networks:
      - app-network 
networks:
  app-network:
    external: false

volumes:
  grand_sampan_db_prod_data:
  uploads_data:
