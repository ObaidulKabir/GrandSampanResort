services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      target: production
    container_name: grand-sampan-frontend
    restart: unless-stopped
    environment:
      # Server-rendered pages call the backend over the internal Docker
      # network instead of hairpinning back out through the public domain
      # and Traefik; the browser still uses NEXT_PUBLIC_API_URL.
      - API_URL=http://grand-sampan-backend:4000
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grand-sampan-frontend.rule=Host(`www.grandsampanresort.com`)"
      - "traefik.http.routers.grand-sampan-frontend.entrypoints=web"
      - "traefik.http.routers.grand-sampan-frontend.priority=1"
      - "traefik.http.routers.grand-sampan-frontend.tls=true"
      - "traefik.http.routers.grand-sampan-frontend.tls.certresolver=le"
      - "traefik.http.services.grand-sampan-frontend.loadbalancer.server.port=3000"

  backend:
    build:
      context: ./backend
      target: production
    container_name: grand-sampan-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Bootstraps the first admin account on startup; only created if this
      # email doesn't already exist, so it's safe to leave set permanently.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://www.grandsampanresort.com}
      - SMTP_HOST=${SMTP_HOST:-smtppro.zoho.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-admin@grandsampanresort.com}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-Grand Sampan Resort <admin@grandsampanresort.com>}
      - MAIL_BCC=${MAIL_BCC:-admin@grandsampanresort.com}

    volumes:
      # Persist uploaded media across container rebuilds/redeploys.
      - uploads_data:/app/uploads
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      # Serve both JSON APIs and static /uploads from the backend. Without
      # /uploads here, Traefik sends image requests to Next.js (404).
      - "traefik.http.routers.grand-sampan-backend.rule=Host(`www.grandsampanresort.com`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.grand-sampan-backend.entrypoints=web"
      - "traefik.http.routers.grand-sampan-backend.priority=100"
      - "traefik.http.services.grand-sampan-backend.loadbalancer.server.port=4000"
      - "traefik.http.routers.grand-sampan-backend.tls=true"
      - "traefik.http.routers.grand-sampan-backend.tls.certresolver=le"
networks:
  app-network:
    external: true

volumes:
  grand_sampan_db_prod_data:
  uploads_data:
